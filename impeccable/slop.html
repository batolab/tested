<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Trang mẫu — đầy dấu hiệu AI slop</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  * { font-family: 'Inter', sans-serif; margin: 0; }
  body { background: linear-gradient(135deg, #7C3AED, #2563EB); padding: 12px; }
  .hero { text-align: center; padding: 16px; }
  .hero h1 { color: #E5E7EB; font-size: 28px; }
  .hero p { color: #9CA3AF; font-size: 13px; }
  .btn { background: #111827; color: #6B7280; border-radius: 999px; padding: 6px 18px; border: none; }
  .card { background: rgba(255,255,255,0.15); border-radius: 24px; padding: 8px; margin: 6px; }
  .card-inner { background: rgba(255,255,255,0.2); border-radius: 20px; padding: 6px; }
  .icon { width: 48px; height: 48px; border-radius: 16px; background: linear-gradient(135deg,#EC4899,#8B5CF6); }
  .card h3 { color: #F3F4F6; font-size: 15px; }
  .card p { color: #9CA3AF; font-size: 11px; }
</style>
</head>
<body>
  <div class="hero">
    <h1>Giải pháp AI toàn diện cho mọi doanh nghiệp</h1>
    <p>Nền tảng đột phá giúp tối ưu mọi quy trình trong nháy mắt</p>
    <button class="btn">Bắt đầu ngay</button>
    <button class="btn">Tìm hiểu thêm</button>
  </div>
  <div class="card"><div class="card-inner">
    <div class="icon"></div>
    <h3>Tính năng mạnh mẽ</h3>
    <p>Công nghệ tiên tiến nhất hiện nay</p>
  </div></div>
  <div class="card"><div class="card-inner">
    <div class="icon"></div>
    <h3>Dễ dàng sử dụng</h3>
    <p>Giao diện thân thiện với mọi người dùng</p>
  </div></div>
  <div class="card"><div class="card-inner">
    <div class="icon"></div>
    <h3>Hỗ trợ 24/7</h3>
    <p>Đội ngũ luôn sẵn sàng đồng hành cùng bạn</p>
  </div></div>
</body>
</html>
